<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دوجوی ویم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root {
    --ground: #FBFAF7; --panel: #F3F1EC; --card: #FFFFFF;
    --ink: #1C1D26; --ink-soft: #4A4D5A; --muted: #6E7280; --rule: #DEDBD3;
    --accent: #1F7A68; --accent-soft: #E4F0ED; --warn: #A76A22; --warn-soft: #F7EEDF;
    --danger: #A63C33; --danger-soft: #F8E8E6; --star: #C98A12;
    --key-bg: #FFFFFF; --key-edge: #CFCBC2;
    --ed-bg: #16171F; --ed-gutter: #1B1C25; --ed-fg: #D7D9E0; --ed-dim: #5B5F70; --ed-num: #C9CBD3;
    --ed-sel: #2F3F5E; --ed-kw: #C69CF2; --ed-st: #9ECE6A; --ed-cm: #6B7089; --ed-nu: #FF9E64; --ed-fn: #7AA2F7; --ed-br: #89DDFF;
    --ed-cur: #E8E6E1; --ed-tgt: #4FB8A2; --ed-flash: #FF007C; --ed-match: #3B4261;
    --mono: "JetBrains Mono", "Fira Code", "DejaVu Sans Mono", ui-monospace, monospace;
    --sans: "Vazirmatn", "Noto Sans Arabic", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #12131A; --panel: #1A1C25; --card: #1E2029;
      --ink: #E8E6E1; --ink-soft: #B6B8C0; --muted: #8A8D99; --rule: #2B2E39;
      --accent: #4FB8A2; --accent-soft: #16302B; --warn: #D9A059; --warn-soft: #2E2517;
      --danger: #D9776B; --danger-soft: #2E1B19; --star: #E8B84A;
      --key-bg: #232630; --key-edge: #3A3E4B; --ed-bg: #0F1016; --ed-gutter: #13141B;
    }
  }
  :root[data-theme="dark"] {
    --ground: #12131A; --panel: #1A1C25; --card: #1E2029;
    --ink: #E8E6E1; --ink-soft: #B6B8C0; --muted: #8A8D99; --rule: #2B2E39;
    --accent: #4FB8A2; --accent-soft: #16302B; --warn: #D9A059; --warn-soft: #2E2517;
    --danger: #D9776B; --danger-soft: #2E1B19; --star: #E8B84A;
    --key-bg: #232630; --key-edge: #3A3E4B; --ed-bg: #0F1016; --ed-gutter: #13141B;
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--ground); color: var(--ink); font-family: var(--sans); line-height: 1.7; -webkit-font-smoothing: antialiased; min-height: 100vh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .ltr { direction: ltr; unicode-bidi: isolate; }

  /* ---- top bar ---- */
  header.top { display: flex; align-items: center; gap: 1.5rem; flex-wrap: wrap; padding: 1rem 1.5rem; border-bottom: 1px solid var(--rule); position: sticky; top: 0; background: var(--ground); z-index: 10; }
  .brand { display: flex; align-items: center; gap: .75rem; }
  .logo { font-family: var(--mono); font-weight: 600; font-size: .85rem; background: var(--ink); color: var(--ground); padding: .3rem .55rem; border-radius: 6px; direction: ltr; }
  .brand h1 { font-size: 1.15rem; font-weight: 800; line-height: 1.2; }
  .brand p { font-size: .78rem; color: var(--muted); }
  nav.tabs { display: flex; gap: .25rem; background: var(--panel); padding: .25rem; border-radius: 10px; }
  nav.tabs button { border: 0; background: transparent; padding: .4rem .9rem; border-radius: 7px; font-size: .9rem; color: var(--ink-soft); }
  nav.tabs button.on { background: var(--card); color: var(--ink); font-weight: 700; box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
  .meta { margin-inline-start: auto; display: flex; align-items: center; gap: 1rem; font-size: .85rem; color: var(--ink-soft); }
  .meta b { color: var(--ink); }
  .iconbtn { border: 1px solid var(--rule); background: var(--card); border-radius: 8px; padding: .25rem .55rem; font-size: .85rem; }
  .layout-flag { font-size: .75rem; background: var(--warn-soft); color: var(--warn); padding: .15rem .5rem; border-radius: 6px; }

  main { max-width: 84rem; margin: 0 auto; padding: 1.5rem; }

  /* ---- dojo ---- */
  #tab-dojo { display: grid; grid-template-columns: 16rem minmax(0, 1fr); gap: 2rem; align-items: start; }
  .lessons { position: sticky; top: 5.5rem; max-height: calc(100vh - 7rem); overflow-y: auto; padding-inline-end: .25rem; }
  .lessons h3 { font-size: .72rem; letter-spacing: .08em; color: var(--muted); margin: 1rem 0 .35rem; font-weight: 700; }
  .lessons h3:first-child { margin-top: 0; }
  .lesson-btn { display: flex; align-items: center; gap: .6rem; width: 100%; text-align: start; border: 0; background: transparent; padding: .45rem .6rem; border-radius: 8px; font-size: .88rem; color: var(--ink-soft); }
  .lesson-btn:hover { background: var(--panel); }
  .lesson-btn.on { background: var(--accent-soft); color: var(--ink); font-weight: 700; }
  .lesson-btn .num { font-family: var(--mono); font-size: .72rem; color: var(--muted); width: 1.4rem; text-align: center; }
  .lesson-btn .t { flex: 1; }
  .stars { color: var(--star); font-size: .78rem; letter-spacing: -.05em; direction: ltr; white-space: nowrap; }
  .stars .off { color: var(--rule); }

  .stage { min-width: 0; position: relative; }
  .eyebrow { font-size: .75rem; color: var(--accent); font-weight: 700; letter-spacing: .04em; }
  .stage h2 { font-size: 1.6rem; font-weight: 800; line-height: 1.3; margin: .15rem 0 .5rem; }
  .intro { color: var(--ink-soft); max-width: 46rem; font-size: .95rem; }
  .keychips { display: flex; flex-wrap: wrap; gap: .5rem 1rem; margin: .9rem 0 1.25rem; }
  .keychip { display: flex; align-items: center; gap: .45rem; font-size: .85rem; color: var(--ink-soft); }
  kbd, .kbd { font-family: var(--mono); font-size: .82rem; background: var(--key-bg); border: 1px solid var(--key-edge); border-bottom-width: 2px; border-radius: 5px; padding: .05rem .4rem; color: var(--ink); direction: ltr; unicode-bidi: isolate; white-space: nowrap; display: inline-block; line-height: 1.5; }

  .taskbar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: .6rem; }
  .task { font-weight: 700; font-size: 1.02rem; flex: 1; min-width: 14rem; }
  .dots { display: flex; gap: .3rem; direction: ltr; }
  .dots i { width: .6rem; height: .6rem; border-radius: 50%; background: var(--rule); display: block; }
  .dots i.done { background: var(--accent); }
  .dots i.now { background: var(--ink); }
  .timer { font-family: var(--mono); font-weight: 600; font-size: 1.1rem; direction: ltr; }

  /* editor */
  .editor { background: var(--ed-bg); border-radius: 12px; overflow: hidden; direction: ltr; box-shadow: 0 1px 0 rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .08); outline: 2px solid transparent; transition: outline-color .2s; }
  .editor.win { outline-color: var(--ed-tgt); }
  .editor.shake { animation: shake .25s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .buf { font-family: var(--mono); font-size: 15px; line-height: 1.6; color: var(--ed-fg); padding: .7rem 0; overflow-x: auto; }
  .ln { display: flex; white-space: pre; min-height: 1.6em; }
  .gut { width: 3.2rem; flex: none; text-align: right; padding-right: .9rem; color: var(--ed-dim); user-select: none; }
  .gut.gcur { color: var(--ed-num); font-weight: 600; }
  .gut.diff::before { content: "●"; color: var(--ed-nu); font-size: .6em; margin-right: .5em; vertical-align: middle; }
  .txt { flex: 1; padding-right: 1rem; }
  .txt span { position: relative; }
  .kw { color: var(--ed-kw); } .st { color: var(--ed-st); } .cm { color: var(--ed-cm); font-style: italic; } .nu { color: var(--ed-nu); } .fn { color: var(--ed-fn); } .br { color: var(--ed-br); }
  .sel { background: var(--ed-sel); }
  .tgt { outline: 2px solid var(--ed-tgt); outline-offset: -1px; border-radius: 2px; background: rgb(79 184 162 / .22); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { background: rgb(79 184 162 / .45); } }
  .cur { background: var(--ed-cur) !important; color: var(--ed-bg) !important; border-radius: 1px; outline: none; animation: none; }
  .bar { box-shadow: inset 2px 0 0 var(--ed-cur); }
  .flashing .txt span { color: var(--ed-dim); }
  .flashing .txt span.fm { background: var(--ed-match); color: var(--ed-fg); }
  .flashing .txt span.fl { background: var(--ed-flash); color: #fff; font-weight: 600; }
  .status { display: flex; align-items: stretch; font-family: var(--mono); font-size: 12.5px; background: var(--ed-gutter); color: var(--ed-dim); }
  .mode { padding: .2rem .8rem; font-weight: 600; color: #11121a; background: #7AA2F7; }
  .mode.insert { background: #9ECE6A; } .mode.visual, .mode.vline { background: #C69CF2; } .mode.flash { background: var(--ed-flash); color: #fff; }
  .status .file { padding: .2rem .8rem; color: var(--ed-fg); }
  .status .pend { margin-left: auto; padding: .2rem .8rem; color: var(--ed-nu); }
  .status .pos { padding: .2rem .8rem; }
  .cmdline { font-family: var(--mono); font-size: 13px; padding: .25rem .9rem; min-height: 1.9em; color: var(--ed-fg); background: var(--ed-bg); white-space: pre; }
  .cmdline.err { color: #F7768E; }
  .cmdline .msg-fa { font-family: var(--sans); direction: rtl; unicode-bidi: isolate; }

  .goal { margin-top: .9rem; border: 1px dashed var(--rule); border-radius: 12px; overflow: hidden; }
  .goal .label { font-size: .78rem; font-weight: 700; color: var(--muted); padding: .4rem .9rem; background: var(--panel); }
  .goal .buf { direction: ltr; background: var(--card); color: var(--ink); padding: .5rem 0; }
  .goal .gut { color: var(--muted); }
  .goal .kw { color: #8A4FCB; } .goal .st { color: #3F7F2A; } .goal .cm { color: var(--muted); } .goal .nu { color: #B25A1E; } .goal .fn { color: #2F5FC4; } .goal .br { color: #1F7A99; }
  :root[data-theme="dark"] .goal .buf { color: var(--ed-fg); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .goal .kw { color: var(--ed-kw); } :root:not([data-theme="light"]) .goal .st { color: var(--ed-st); } :root:not([data-theme="light"]) .goal .fn { color: var(--ed-fn); } :root:not([data-theme="light"]) .goal .nu { color: var(--ed-nu); } }
  :root[data-theme="dark"] .goal .kw { color: var(--ed-kw); } :root[data-theme="dark"] .goal .st { color: var(--ed-st); } :root[data-theme="dark"] .goal .fn { color: var(--ed-fn); } :root[data-theme="dark"] .goal .nu { color: var(--ed-nu); }

  .scorebar { display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; margin-top: .9rem; font-size: .88rem; color: var(--ink-soft); }
  .scorebar .count { font-family: var(--mono); direction: ltr; }
  .scorebar .count b { font-size: 1.05rem; color: var(--ink); }
  .scorebar .count.over b { color: var(--danger); }
  .keylog { display: flex; gap: .2rem; flex-wrap: wrap; direction: ltr; flex: 1; min-width: 8rem; }
  .keylog .kbd { font-size: .72rem; padding: 0 .3rem; opacity: .85; }
  .btn { border: 1px solid var(--rule); background: var(--card); border-radius: 8px; padding: .3rem .8rem; font-size: .85rem; }
  .btn:hover { border-color: var(--ink-soft); }
  .btn.primary { background: var(--ink); color: var(--ground); border-color: var(--ink); font-weight: 700; }
  .hint { margin-top: .75rem; padding: .6rem .9rem; border-radius: 10px; background: var(--warn-soft); color: var(--ink); font-size: .9rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .hint .kbd { background: var(--card); }
  .toast { position: absolute; inset-inline: 0; top: 40%; margin: auto; width: fit-content; background: var(--ink); color: var(--ground); padding: .8rem 1.4rem; border-radius: 12px; font-weight: 700; font-size: 1.05rem; box-shadow: 0 10px 30px rgb(0 0 0 / .25); pointer-events: none; animation: pop .25s ease-out; z-index: 5; text-align: center; }
  .toast .stars { font-size: 1.3rem; color: var(--star); display: block; }
  @keyframes pop { from { transform: scale(.9); opacity: 0; } }
  .summary { background: var(--card); border: 1px solid var(--rule); border-radius: 14px; padding: 2rem; text-align: center; }
  .summary .big { font-size: 2.6rem; color: var(--star); direction: ltr; }
  .summary h3 { font-size: 1.4rem; margin: .3rem 0; }
  .summary p { color: var(--ink-soft); }
  .summary .row { display: flex; gap: .75rem; justify-content: center; margin-top: 1.25rem; flex-wrap: wrap; }
  .note { font-size: .8rem; color: var(--muted); margin-top: 1.25rem; }

  /* ---- drill ---- */
  .drill { max-width: 46rem; margin: 0 auto; }
  .drill-top { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-bottom: 1rem; }
  .seg { display: flex; background: var(--panel); border-radius: 9px; padding: .2rem; }
  .seg button { border: 0; background: transparent; padding: .3rem .8rem; border-radius: 7px; font-size: .85rem; color: var(--ink-soft); }
  .seg button.on { background: var(--card); color: var(--ink); font-weight: 700; }
  .cats { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1.25rem; }
  .cat { border: 1px solid var(--rule); background: transparent; border-radius: 999px; padding: .2rem .75rem; font-size: .82rem; color: var(--ink-soft); }
  .cat.on { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
  .cat small { color: var(--muted); margin-inline-start: .3rem; }
  .card { background: var(--card); border: 1px solid var(--rule); border-radius: 16px; padding: 2rem 1.5rem; text-align: center; min-height: 18rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9rem; }
  .card.good { border-color: var(--accent); }
  .card.bad { border-color: var(--danger); animation: shake .25s; }
  .card .ccat { font-size: .75rem; color: var(--muted); }
  .card .prompt { font-size: 1.6rem; font-weight: 800; line-height: 1.4; }
  .card .prompt .kbd { font-size: 1.6rem; padding: .1rem .6rem; }
  .card .cmode { font-size: .78rem; background: var(--panel); padding: .1rem .6rem; border-radius: 6px; color: var(--ink-soft); }
  .slots { display: flex; gap: .4rem; direction: ltr; flex-wrap: wrap; justify-content: center; }
  .slot { min-width: 2.6rem; height: 2.6rem; border: 2px solid var(--rule); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-weight: 600; padding: 0 .4rem; }
  .slot.ok { border-color: var(--accent); background: var(--accent-soft); }
  .slot.next { border-color: var(--ink-soft); }
  .answer { font-size: .95rem; color: var(--danger); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; width: 100%; max-width: 34rem; }
  .opt { border: 1px solid var(--rule); background: var(--ground); border-radius: 10px; padding: .6rem .8rem; text-align: start; font-size: .92rem; display: flex; gap: .6rem; align-items: center; }
  .opt .n { font-family: var(--mono); color: var(--muted); }
  .opt.right { border-color: var(--accent); background: var(--accent-soft); }
  .opt.wrong { border-color: var(--danger); background: var(--danger-soft); }
  .dstats { display: flex; justify-content: space-between; gap: 1rem; font-size: .85rem; color: var(--ink-soft); margin-top: .8rem; flex-wrap: wrap; }
  .dstats b { color: var(--ink); }
  .speed { font-weight: 700; }
  .misslist { text-align: start; margin-top: 1rem; display: grid; gap: .35rem; }
  .misslist div { display: flex; gap: .75rem; align-items: center; font-size: .9rem; }

  /* ---- stats ---- */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .kpi { background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 1rem 1.2rem; }
  .kpi .v { font-size: 1.8rem; font-weight: 800; line-height: 1.2; }
  .kpi .l { font-size: .8rem; color: var(--muted); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  .cols h3 { font-size: 1rem; margin-bottom: .75rem; }
  .barrow { display: grid; grid-template-columns: 11rem 1fr 3.5rem; gap: .75rem; align-items: center; font-size: .85rem; margin-bottom: .5rem; }
  .track { height: .55rem; background: var(--panel); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); border-radius: 999px; }
  .barrow .pct { font-family: var(--mono); color: var(--muted); text-align: left; direction: ltr; }
  .lrow { display: flex; justify-content: space-between; font-size: .88rem; padding: .3rem 0; border-bottom: 1px solid var(--rule); }
  .weak { display: grid; gap: .4rem; }
  .weak div { display: flex; gap: .75rem; align-items: center; font-size: .88rem; }
  .danger-btn { border-color: var(--danger); color: var(--danger); }

  @media (max-width: 60rem) {
    #tab-dojo { grid-template-columns: minmax(0, 1fr); }
    .lessons { position: static; max-height: none; display: flex; flex-wrap: wrap; gap: .25rem; }
    .lessons h3 { width: 100%; }
    .lesson-btn { width: auto; }
    .cols { grid-template-columns: 1fr; }
    main { padding: 1rem; }
    header.top { padding: .75rem 1rem; gap: .75rem; }
    .opts { grid-template-columns: 1fr; }
    .barrow { grid-template-columns: 7rem 1fr 3rem; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">:dojo</span><div><h1>دوجوی ویم</h1><p>تمرین تعاملی Neovim با کانفیگ خودت</p></div></div>
  <nav class="tabs">
    <button data-tab="dojo" class="on">تمرین تعاملی</button>
    <button data-tab="drill">دریل میانبرها</button>
    <button data-tab="stats">پیشرفت</button>
  </nav>
  <div class="meta">
    <span id="layoutFlag" class="layout-flag" hidden>کیبورد فارسی → خودکار انگلیسی</span>
    <span>🔥 <b id="streak">۰</b> روز</span>
    <span>★ <b id="starTotal">۰</b></span>
    <button class="iconbtn" id="themeBtn" title="تم">◐</button>
  </div>
</header>
<main>
  <section id="tab-dojo">
    <aside class="lessons" id="lessonList"></aside>
    <div class="stage" id="stage">
      <div id="lessonView">
        <div class="eyebrow" id="lEyebrow"></div>
        <h2 id="lTitle"></h2>
        <p class="intro" id="lIntro"></p>
        <div class="keychips" id="lKeys"></div>
        <div class="taskbar"><div class="task" id="taskText"></div><div class="timer" id="timer" hidden></div><div class="dots" id="dots"></div></div>
        <div class="editor" id="editor">
          <div class="buf" id="buf"></div>
          <div class="status"><span class="mode" id="mode">NORMAL</span><span class="file" id="file">practice.py</span><span class="pend" id="pend"></span><span class="pos" id="pos"></span></div>
          <div class="cmdline" id="cmdline"></div>
        </div>
        <div class="goal" id="goalBox" hidden><div class="label">هدف — متن بالا را به این شکل در بیاور</div><div class="buf" id="goalBuf"></div></div>
        <div class="scorebar">
          <span class="count" id="count"></span>
          <div class="keylog" id="keylog"></div>
          <button class="btn" id="hintBtn">راهنما</button>
          <button class="btn" id="resetBtn">از اول</button>
          <button class="btn" id="skipBtn">رد کن</button>
        </div>
        <div class="hint" id="hintBox" hidden></div>
      </div>
      <div id="summary" hidden></div>
      <p class="note">همه‌ی کلیدها مستقیم از کیبورد خوانده می‌شوند — لازم نیست روی چیزی کلیک کنی. Space همان &lt;leader&gt; است.</p>
    </div>
  </section>

  <section id="tab-drill" hidden>
    <div class="drill">
      <div class="drill-top">
        <div class="seg" id="dMode">
          <button data-m="recall" class="on">معنی ← کلید (تایپ کن)</button>
          <button data-m="recog">کلید ← معنی (۱ تا ۴)</button>
        </div>
        <button class="btn primary" id="dStart">شروع دور تازه</button>
      </div>
      <div class="cats" id="dCats"></div>
      <div class="card" id="dCard"></div>
      <div class="dstats" id="dStats"></div>
    </div>
  </section>

  <section id="tab-stats" hidden>
    <div id="statsView"></div>
  </section>
</main>
<script>
"use strict";
// ---- A small Vim engine: enough of normal/insert/visual mode to practice with.
const KEYRE = /<(?:Esc|CR|BS|Tab|S-Tab|S-CR|leader|Left|Right|Up|Down|C-[a-z_]|F\d{1,2})>|[\s\S]/g;
const toks = s => s.match(KEYRE) || [];
const cls = (ch, big) => (ch === undefined || ch === ' ' || ch === '\t') ? 0 : big ? 1 : (/\w/.test(ch) ? 1 : 2);
const OPEN = { '(': ')', '[': ']', '{': '}', '<': '>' };
const CLOSE = { ')': '(', ']': '[', '}': '{', '>': '<' };
const OBJ_BR = { '(': '(', ')': '(', b: '(', '[': '[', ']': '[', '{': '{', '}': '{', B: '{', '<': '<', '>': '<' };
const AP_OPEN = { '(': ')', '[': ']', '{': '}' };
const AP_ALL = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
const indentOf = s => s.match(/^\s*/)[0];
const cmpPos = (a, b) => a.r - b.r || a.c - b.c;
const FLASH_LABELS = 'asdfghjklqwertyuiopzxcvbnm';
const ALIAS = { x: ['d', 'l'], X: ['d', 'h'], D: ['d', '$'], C: ['c', '$'], Y: ['y', '$'] };
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

class Vim {
  constructor(lines, r = 0, c = 0) {
    this.lines = lines.length ? lines.slice() : [''];
    this.r = r; this.c = c; this.want = c;
    this.mode = 'normal'; this.pending = [];
    this.reg = { t: '', lw: false };
    this.undoStack = []; this.redoStack = [];
    this.dot = null; this.rec = null; this.chSnap = null;
    this.lastFind = null; this.lastSearch = null;
    this.cmd = null; this.flash = null; this.va = null;
    this.msg = ''; this.err = false; this.jj = 0; this.prevJ = false; this.replaying = false;
  }
  snap() { return { lines: this.lines.slice(), r: this.r, c: this.c }; }
  len(r) { return this.lines[r].length; }
  firstNB(r) { const i = this.lines[r].search(/\S/); return i < 0 ? Math.max(0, this.len(r) - 1) : i; }
  firstNBraw(r) { const i = this.lines[r].search(/\S/); return i < 0 ? this.len(r) : i; }
  colFor(r, want) { const m = Math.max(0, this.len(r) - 1); return want === Infinity ? m : Math.min(want, m); }
  clamp() {
    this.r = Math.max(0, Math.min(this.r, this.lines.length - 1));
    const max = this.mode === 'insert' ? this.len(this.r) : Math.max(0, this.len(this.r) - 1);
    this.c = Math.max(0, Math.min(this.c, max));
  }
  setPos(r, c, want) { this.r = r; this.c = c; this.clamp(); this.want = want === undefined ? this.c : want; }
  fail(m) { this.err = true; if (m) this.msg = m; }

  // ---------- input ----------
  feed(k) {
    this.err = false;
    if (!this.replaying) this.msg = '';
    if (this.flash) return this.feedFlash(k);
    if (this.cmd) return this.feedCmd(k);
    if (this.mode === 'insert') return this.feedInsert(k);
    if (['<Left>', '<Right>', '<Up>', '<Down>'].includes(k)) { this.pending = []; return this.fail('فلش‌ها ممنوع! از h j k l استفاده کن'); }
    if (k === '<Esc>') { if (this.pending.length) this.pending = []; else if (this.mode !== 'normal') this.exitVisual(); return; }
    this.pending.push(k);
    const p = this.mode === 'normal' ? this.parseNormal(this.pending) : this.parseVisual(this.pending);
    if (p === 'more') return;
    const keys = this.pending; this.pending = [];
    if (!p) return this.fail();
    this.run(p, keys);
  }
  feedAll(keys) { for (const k of (typeof keys === 'string' ? toks(keys) : keys)) this.feed(k); }

  // ---------- parsing ----------
  readCount(t, i) { let s = ''; while (i < t.length && /^[0-9]$/.test(t[i]) && !(s === '' && t[i] === '0')) s += t[i++]; return [s ? +s : 0, i]; }
  parseMotion(t, i) {
    if (i >= t.length) return 'more';
    const k = t[i];
    if (k.length === 1 && 'hjklwbeWBE0^$G%{};,nN*#'.includes(k)) return { m: { k }, i: i + 1 };
    if (k === '<BS>') return { m: { k: 'h' }, i: i + 1 };
    if (k.length === 1 && 'fFtT'.includes(k)) {
      if (i + 1 >= t.length) return 'more';
      const a = t[i + 1]; if (a.length !== 1) return null;
      return { m: { k, arg: a }, i: i + 2 };
    }
    if (k === 'g' || k === ']' || k === '[') {
      if (i + 1 >= t.length) return 'more';
      const a = t[i + 1];
      if (k === 'g' && (a === 'g' || a === 'e' || a === 'E')) return { m: { k: 'g' + a }, i: i + 2 };
      if (k !== 'g' && (a === 'f' || a === 'c')) return { m: { k: k + a }, i: i + 2 };
    }
    return null;
  }
  parseObj(t, i) {
    const k = t[i]; if (k !== 'i' && k !== 'a') return null;
    if (i + 1 >= t.length) return 'more';
    const o = t[i + 1]; if (o.length !== 1 || !'wWp"\'`()b[]{}B<>fc'.includes(o)) return null;
    return { o: { k, o }, i: i + 2 };
  }
  parseOpTarget(t, i, op, n1) {
    const [n2, j] = this.readCount(t, i);
    if (j >= t.length) return 'more';
    const n = n1 || n2 ? (n1 || 1) * (n2 || 1) : 0;
    const ob = this.parseObj(t, j);
    if (ob === 'more') return 'more';
    if (ob) return { type: 'op', op, obj: ob.o, n, end: ob.i };
    const mo = this.parseMotion(t, j);
    if (mo === 'more' || !mo) return mo;
    return { type: 'op', op, m: mo.m, n, end: mo.i };
  }
  parseNormal(t) {
    const [n1, i] = this.readCount(t, 0);
    if (i >= t.length) return 'more';
    const k = t[i], nx = t[i + 1], has = j => j < t.length;
    if ((k.length === 1 && 'xXDCYJpPu.~iaIAoOvVs:/?S '.includes(k)) || ['<C-r>', '<S-CR>', '<C-_>', '<leader>', '<CR>', '<Tab>', '<S-Tab>'].includes(k))
      return { type: k, n: n1 };
    if (k === 'r') { if (!has(i + 1)) return 'more'; return nx.length === 1 ? { type: 'r', n: n1, arg: nx } : null; }
    if (k === 'z') { if (!has(i + 1)) return 'more'; return { type: 'noop' }; }
    if (k === 'g' && !has(i + 1)) return 'more';
    if (k === 'g' && 'cuU~'.includes(nx)) {
      const op = 'g' + nx;
      if (!has(i + 2)) return 'more';
      if (t[i + 2] === ({ gc: 'c', gu: 'u', gU: 'U', 'g~': '~' })[op]) return { type: 'opline', op, n: n1 || 1 };
      return this.parseOpTarget(t, i + 2, op, n1);
    }
    if ((k === 'd' || k === 'c') && nx === 's') {
      if (k === 'd') { if (!has(i + 2)) return 'more'; return t[i + 2].length === 1 ? { type: 'ds', arg: t[i + 2] } : null; }
      if (!has(i + 3)) return 'more';
      return (t[i + 2].length === 1 && t[i + 3].length === 1) ? { type: 'cs', arg: t[i + 2], arg2: t[i + 3] } : null;
    }
    if (k === 'y' && nx === 's') {
      if (!has(i + 2)) return 'more';
      if (t[i + 2] === 's') { if (!has(i + 3)) return 'more'; return { type: 'yss', arg: t[i + 3] }; }
      const r = this.parseOpTarget(t, i + 2, 'ys', n1);
      if (r === 'more' || !r) return r;
      if (!has(r.end)) return 'more';
      r.arg = t[r.end]; return r;
    }
    if (k.length === 1 && 'dcy<>'.includes(k)) {
      if (!has(i + 1)) return 'more';
      const [n2, j] = this.readCount(t, i + 1);
      if (!has(j)) return 'more';
      if (t[j] === k) return { type: 'opline', op: k, n: (n1 || 1) * (n2 || 1) };
      return this.parseOpTarget(t, i + 1, k, n1);
    }
    const mo = this.parseMotion(t, i);
    if (mo === 'more' || !mo) return mo;
    return { type: 'move', m: mo.m, n: n1 };
  }
  parseVisual(t) {
    const [n1, i] = this.readCount(t, 0);
    if (i >= t.length) return 'more';
    const k = t[i];
    if (k === 'i' || k === 'a') { const ob = this.parseObj(t, i); if (ob === 'more' || !ob) return ob; return { type: 'vobj', obj: ob.o, n: n1 }; }
    if (k === 'g') { if (i + 1 >= t.length) return 'more'; if ('cuU~'.includes(t[i + 1])) return { type: 'vop', op: 'g' + t[i + 1] }; }
    if (k === 'r') { if (i + 1 >= t.length) return 'more'; return t[i + 1].length === 1 ? { type: 'vop', op: 'r', arg: t[i + 1] } : null; }
    if ((k.length === 1 && 'dxyc<>~uUJoOpPvVsDXYC:'.includes(k)) || k === '<C-_>') return { type: 'v', k, n: n1 };
    const mo = this.parseMotion(t, i); if (mo === 'more' || !mo) return mo;
    return { type: 'move', m: mo.m, n: n1 };
  }
}

// ---------- motions ----------
Object.assign(Vim.prototype, {
  motion(m, n, P, op) {
    const L = this.lines, N = L.length, cnt = n || 1, r = P.r, c = P.c;
    const R = (r, c, x) => Object.assign({ r, c, want: c }, x);
    switch (m.k) {
      case 'h': return R(r, Math.max(0, c - cnt));
      case 'l': return R(r, Math.min(c + cnt, op ? this.len(r) : Math.max(0, this.len(r) - 1)));
      case 'j': case 'k': {
        const nr = m.k === 'j' ? Math.min(N - 1, r + cnt) : Math.max(0, r - cnt);
        if (nr === r) return { fail: true };
        return { r: nr, c: this.colFor(nr, P.want), want: P.want, lw: true };
      }
      case '0': return R(r, 0);
      case '^': return R(r, this.firstNB(r));
      case '$': { const nr = Math.min(N - 1, r + cnt - 1); return { r: nr, c: Math.max(0, this.len(nr) - 1), want: Infinity, inc: true }; }
      case 'w': case 'W': {
        let p = { r, c };
        for (let i = 0; i < cnt; i++) p = this.nextWordStart(p.r, p.c, m.k === 'W');
        return R(p.r, p.eob ? Math.max(0, this.len(p.r) - 1) : p.c);
      }
      case 'e': case 'E': { let p = { r, c }; for (let i = 0; i < cnt; i++) p = this.wordEnd(p.r, p.c, m.k === 'E'); return R(p.r, p.c, { inc: true }); }
      case 'b': case 'B': { let p = { r, c }; for (let i = 0; i < cnt; i++) p = this.wordBack(p.r, p.c, m.k === 'B'); return R(p.r, p.c); }
      case 'ge': case 'gE': { let p = { r, c }; for (let i = 0; i < cnt; i++) p = this.wordEndBack(p.r, p.c, m.k === 'gE'); return R(p.r, p.c, { inc: true }); }
      case 'gg': case 'G': { const nr = n ? Math.min(N, n) - 1 : (m.k === 'G' ? N - 1 : 0); return R(nr, this.firstNB(nr), { lw: true }); }
      case 'f': case 'F': case 't': case 'T': return this.findChar(m.k, m.arg, cnt, P, false);
      case ';': case ',': {
        const lf = this.lastFind; if (!lf) return { fail: true };
        const k = m.k === ',' ? { f: 'F', F: 'f', t: 'T', T: 't' }[lf.k] : lf.k;
        return this.findChar(k, lf.arg, cnt, P, true);
      }
      case '%': return this.matchPair(r, c);
      case '}': case '{': return this.para(m.k, cnt, r);
      case 'n': case 'N': {
        const s = this.lastSearch; if (!s) return { fail: true, msg: 'هنوز جستجویی نکرده‌ای' };
        return this.searchFrom(P, s.pat, m.k === 'n' ? s.dir : -s.dir, s.word, cnt);
      }
      case '*': case '#': {
        const w = this.wordUnder(r, c); if (!w) return { fail: true };
        const dir = m.k === '*' ? 1 : -1;
        const res = this.searchFrom({ r, c: w.s }, w.text, dir, true, cnt);
        if (!res.fail) res.search = { pat: w.text, dir, word: true };
        return res;
      }
      case ']f': case '[f': case ']c': case '[c': {
        const re = m.k[1] === 'f' ? /^\s*(async\s+)?def\s/ : /^\s*class\s/, d = m.k[0] === ']' ? 1 : -1;
        let i = r;
        for (let t = 0; t < cnt; t++) {
          let found = -1;
          for (let j = i + d; j >= 0 && j < N; j += d) if (re.test(L[j])) { found = j; break; }
          if (found < 0) return { fail: true };
          i = found;
        }
        return R(i, this.firstNB(i));
      }
    }
    return { fail: true };
  },
  nextWordStart(r, c, big) {
    const L = this.lines, N = L.length;
    let l = L[r];
    if (c < l.length) { const k = cls(l[c], big); if (k) while (c < l.length && cls(l[c], big) === k) c++; }
    for (;;) {
      l = L[r];
      if (c >= l.length) {
        if (r + 1 >= N) return { r, c: l.length, eob: true };
        r++; c = 0;
        if (L[r].length === 0) return { r, c: 0 };
        continue;
      }
      if (cls(l[c], big) === 0) c++; else return { r, c };
    }
  },
  wordEnd(r, c, big) {
    const L = this.lines, N = L.length;
    const step = () => { if (c < L[r].length - 1) { c++; return true; } if (r + 1 >= N) return false; r++; c = 0; return true; };
    if (!step()) return { r, c };
    while (L[r].length === 0 || cls(L[r][c], big) === 0) if (!step()) return { r, c };
    const k = cls(L[r][c], big);
    while (c + 1 < L[r].length && cls(L[r][c + 1], big) === k) c++;
    return { r, c };
  },
  wordBack(r, c, big) {
    const L = this.lines;
    const step = () => { if (c > 0) { c--; return true; } if (r === 0) return false; r--; c = Math.max(0, L[r].length - 1); return true; };
    if (!step()) return { r, c };
    for (;;) {
      if (L[r].length === 0) return { r, c: 0 };
      if (cls(L[r][c], big) !== 0) break;
      if (!step()) return { r, c };
    }
    const k = cls(L[r][c], big);
    while (c > 0 && cls(L[r][c - 1], big) === k) c--;
    return { r, c };
  },
  wordEndBack(r, c, big) {
    const L = this.lines, k0 = cls(L[r][c], big);
    let crossed = false;
    const step = () => { if (c > 0) { c--; return true; } if (r === 0) return false; r--; crossed = true; c = Math.max(0, L[r].length - 1); return true; };
    for (;;) {
      if (!step()) return { r: 0, c: 0 };
      if (L[r].length === 0) return { r, c: 0 };
      if (crossed || cls(L[r][c], big) !== k0) break;
    }
    while (cls(L[r][c], big) === 0) { if (!step()) return { r, c }; if (L[r].length === 0) return { r, c: 0 }; }
    return { r, c };
  },
  findChar(k, ch, cnt, P, rep) {
    const l = this.lines[P.r], dir = (k === 'f' || k === 't') ? 1 : -1, till = k === 't' || k === 'T';
    let pos = P.c;
    for (let i = 0; i < cnt; i++) {
      let s = pos + dir;
      if (till && rep && i === 0) s += dir;
      while (s >= 0 && s < l.length && l[s] !== ch) s += dir;
      if (s < 0 || s >= l.length) return { fail: true };
      pos = s;
    }
    const c = till ? pos - dir : pos;
    return { r: P.r, c, want: c, inc: dir > 0, find: rep ? null : { k, arg: ch } };
  },
  matchFrom(r, c) {
    const L = this.lines, ch = L[r][c], fwd = !!OPEN[ch], other = fwd ? OPEN[ch] : CLOSE[ch];
    let depth = 0, pr = r, pc = c;
    for (;;) {
      const x = L[pr][pc];
      if (x === ch) depth++;
      else if (x === other && --depth === 0) return { r: pr, c: pc };
      if (fwd) { pc++; while (pc >= L[pr].length) { pr++; pc = 0; if (pr >= L.length) return null; } }
      else { pc--; while (pc < 0) { pr--; if (pr < 0) return null; pc = L[pr].length - 1; } }
    }
  },
  matchPair(r, c) {
    const l = this.lines[r]; let s = c;
    while (s < l.length && !'()[]{}'.includes(l[s])) s++;
    if (s >= l.length) return { fail: true };
    const p = this.matchFrom(r, s);
    return p ? { r: p.r, c: p.c, want: p.c, inc: true } : { fail: true };
  },
  para(k, cnt, r) {
    const L = this.lines, N = L.length; let i = r;
    for (let t = 0; t < cnt; t++) {
      if (k === '}') {
        while (i < N && L[i] === '') i++;
        while (i < N && L[i] !== '') i++;
        if (i >= N) return { r: N - 1, c: Math.max(0, this.len(N - 1) - 1), want: Infinity, inc: true };
      } else {
        while (i >= 0 && L[i] === '') i--;
        while (i >= 0 && L[i] !== '') i--;
        if (i < 0) return { r: 0, c: 0, want: 0 };
      }
    }
    return { r: i, c: 0, want: 0 };
  },
  wordUnder(r, c) {
    const l = this.lines[r]; let s = c;
    while (s < l.length && !/\w/.test(l[s])) s++;
    if (s >= l.length) return null;
    while (s > 0 && /\w/.test(l[s - 1])) s--;
    let e = s; while (e < l.length && /\w/.test(l[e])) e++;
    return { s, text: l.slice(s, e) };
  },
  searchFrom(P, pat, dir, word, cnt) {
    const re = new RegExp((word ? '\\b' : '') + escRe(pat) + (word ? '\\b' : ''), 'g');
    const hits = [];
    this.lines.forEach((l, r) => { re.lastIndex = 0; let m; while ((m = re.exec(l))) { hits.push({ r, c: m.index }); if (!m[0].length) re.lastIndex++; } });
    if (!hits.length) return { fail: true, msg: 'پیدا نشد: ' + pat };
    let cur = { r: P.r, c: P.c };
    for (let t = 0; t < (cnt || 1); t++) {
      cur = dir > 0 ? (hits.find(h => cmpPos(h, cur) > 0) || hits[0])
                    : ([...hits].reverse().find(h => cmpPos(h, cur) < 0) || hits[hits.length - 1]);
    }
    return { r: cur.r, c: cur.c, want: cur.c };
  },
});

// ---------- text objects & ranges ----------
// A range is { s, e, lw, inc }: linewise rows, or charwise with e inclusive/exclusive.
Object.assign(Vim.prototype, {
  objRange(ob, n) {
    const o = ob.o, inner = ob.k === 'i';
    if (o === 'w' || o === 'W') return this.objWord(inner, o === 'W', n || 1);
    if (o === '"' || o === "'" || o === '`') return this.objQuote(o, inner);
    if (OBJ_BR[o]) return this.objBracket(OBJ_BR[o], inner, n || 1);
    if (o === 'p') return this.objPara(inner);
    if (o === 'f' || o === 'c') return this.objPy(o, inner);
    return null;
  },
  objWord(inner, big, n) {
    const l = this.lines[this.r], r = this.r; if (!l.length) return null;
    const seg = i => { const k = cls(l[i], big); let s = i, e = i; while (s > 0 && cls(l[s - 1], big) === k) s--; while (e < l.length - 1 && cls(l[e + 1], big) === k) e++; return [s, e, k]; };
    let [s, e, k] = seg(Math.min(this.c, l.length - 1));
    if (inner) { for (let i = 1; i < n && e + 1 < l.length; i++) e = seg(e + 1)[1]; }
    else if (k === 0) { if (e + 1 < l.length) e = seg(e + 1)[1]; }
    else if (e + 1 < l.length && cls(l[e + 1], big) === 0) e = seg(e + 1)[1];
    else { let s2 = s; while (s2 > 0 && cls(l[s2 - 1], big) === 0) s2--; if (s2 > 0) s = s2; }
    return { s: { r, c: s }, e: { r, c: e }, inc: true };
  },
  quotePair(q) {
    const l = this.lines[this.r], c = this.c, pos = [];
    for (let i = 0; i < l.length; i++) if (l[i] === q && l[i - 1] !== '\\') pos.push(i);
    for (let i = 0; i + 1 < pos.length; i += 2) if (pos[i] <= c && c <= pos[i + 1]) return [pos[i], pos[i + 1]];
    for (let i = 0; i + 1 < pos.length; i += 2) if (pos[i] > c) return [pos[i], pos[i + 1]];
    return null;
  },
  objQuote(q, inner) {
    const P = this.quotePair(q); if (!P) return null;
    const l = this.lines[this.r], r = this.r; let [s, e] = P;
    if (inner) return e - s === 1 ? { s: { r, c: s + 1 }, e: { r, c: s + 1 } } : { s: { r, c: s + 1 }, e: { r, c: e - 1 }, inc: true };
    let e2 = e; while (e2 + 1 < l.length && l[e2 + 1] === ' ') e2++;
    if (e2 > e) e = e2; else while (s > 0 && l[s - 1] === ' ') s--;
    return { s: { r, c: s }, e: { r, c: e }, inc: true };
  },
  bracketPair(open, n) {
    const L = this.lines, close = OPEN[open];
    let o = L[this.r][this.c] === open ? { r: this.r, c: this.c } : null;
    for (let t = 0; t < n; t++) {
      if (t === 0 && o) continue;
      let sr = o ? o.r : this.r, sc = o ? o.c : this.c, depth = 0; o = null;
      const back = () => { sc--; while (sc < 0) { sr--; if (sr < 0) return false; sc = L[sr].length - 1; } return true; };
      while (back()) {
        const ch = L[sr][sc];
        if (ch === close) depth++;
        else if (ch === open) { if (depth === 0) { o = { r: sr, c: sc }; break; } depth--; }
      }
      if (!o) return null;
    }
    const cl = this.matchFrom(o.r, o.c);
    return cl ? { o, cl } : null;
  },
  objBracket(open, inner, n) {
    const P = this.bracketPair(open, n); if (!P) return null;
    const { o, cl } = P, L = this.lines;
    if (!inner) return { s: o, e: cl, inc: true };
    let s = { r: o.r, c: o.c + 1 }, e = { r: cl.r, c: cl.c };
    if (s.c >= L[s.r].length && s.r < e.r) s = { r: s.r + 1, c: 0 };
    if (e.r > s.r && e.c <= this.firstNBraw(e.r)) {
      if (s.c === 0) return { s: { r: s.r, c: 0 }, e: { r: e.r - 1, c: 0 }, lw: true };

      case 'r': return this.change(null, () => {
        done();
        const E = this.endOf(R);
        for (let r = R.s.r; r <= E.r; r++) {
          const a = R.lw ? 0 : r === R.s.r ? R.s.c : 0, b = R.lw ? this.len(r) : r === E.r ? E.c : this.len(r), l = this.lines[r];
          this.lines[r] = l.slice(0, a) + l.slice(a, b).replace(/./g, p.arg) + l.slice(b);
        }
        this.setPos(R.s.r, R.lw ? 0 : R.s.c);
      });
      case 'p': case 'P': return this.change(null, () => {
        const saved = this.reg; done();
        this.applyOp('d', R);
        const deleted = this.reg; this.reg = saved;
        if (R.lw && saved.lw) this.put(true, 1);
        else if (R.lw) { this.lines.splice(this.r, 0, ''); this.setPos(this.r, 0); this.put(true, 1); }
        else this.put(R.s.c < this.len(this.r), 1);
        this.reg = deleted;
      });

    this.fail();
  },

  // ---------- command line & search ----------
  feedCmd(k) {
    const C = this.cmd;
    if (k === '<Esc>') { this.cmd = null; return; }
    if (k === '<BS>') { if (!C.text) this.cmd = null; else C.text = C.text.slice(0, -1); return; }
    if (k === '<CR>') { this.cmd = null; return this.execCmd(C); }
    if (k.length === 1) C.text += k;
  },
  execCmd(C) {
    if (C.type !== ':') {
      if (C.text) this.lastSearch = { pat: C.text, dir: C.type === '/' ? 1 : -1, word: false };
      else if (!this.lastSearch) return this.fail();
      return this.doMove({ m: { k: 'n' }, n: 0 });
    }
    const t = C.text.trim();
    if (/^\d+$/.test(t)) { const r = Math.max(0, Math.min(+t, this.lines.length) - 1); return this.setPos(r, this.firstNB(r)); }
    const m = t.match(/^(%)?s\/([^/]*)\/([^/]*)(?:\/(g?))?$/);
    if (m) {
      const [, all, pat, rep, g] = m; if (!pat) return this.fail();
      const rows = all ? this.lines.map((_, i) => i) : [this.r];
      let hits = 0;
      this.change(null, () => {
        for (const i of rows) {
          const l = this.lines[i];
          const nl = g ? l.split(pat).join(rep) : l.replace(pat, () => rep);
          if (nl !== l) { this.lines[i] = nl; hits++; this.r = i; }
        }
        this.setPos(this.r, this.firstNB(this.r));
      });
      if (!hits) this.fail('الگو پیدا نشد: ' + pat); else this.msg = `${hits} خط تغییر کرد`;
      return;
    }
    const known = { w: 'ذخیره شد ✓ (شبیه‌سازی)', q: 'اینجا خروجی نداریم 🙂', wq: 'ذخیره و خروج (شبیه‌سازی)', x: 'ذخیره و خروج (شبیه‌سازی)', 'q!': 'خروج بدون ذخیره (شبیه‌سازی)', noh: 'هایلایت جستجو پاک شد' };
    if (known[t]) { this.msg = known[t]; return; }
    this.fail('دستور ناشناخته: :' + t);
  },

  // ---------- flash.nvim ----------
  flashMatches(pat, from) {
    const out = [];
    this.lines.forEach((l, r) => {
      for (let i = l.indexOf(pat); i >= 0; i = l.indexOf(pat, i + 1))
        if (!(r === from.r && i === from.c)) out.push({ r, c: i, nx: l[i + pat.length] });
    });
    out.sort((a, b) => (Math.abs(a.r - from.r) - Math.abs(b.r - from.r)) || (Math.abs(a.c - from.c) - Math.abs(b.c - from.c)));
    const skip = new Set(out.map(m => (m.nx || '').toLowerCase()));
    const labels = [...FLASH_LABELS].filter(ch => !skip.has(ch));
    out.forEach((m, i) => { m.label = labels[i] || null; });
    return out;
  },
  feedFlash(k) {
    const f = this.flash;
    const jump = m => { this.flash = null; this.r = m.r; this.c = m.c; this.clamp(); this.want = this.c; };
    if (k === '<Esc>') { this.flash = null; return; }
    if (k === '<CR>') { if (f.matches[0]) jump(f.matches[0]); else this.flash = null; return; }
    if (k === '<BS>') { f.pat = f.pat.slice(0, -1); f.matches = f.pat ? this.flashMatches(f.pat, this) : []; return; }
    if (k.length !== 1) { this.flash = null; return; }
    const hit = f.pat && f.matches.find(m => m.label === k);
    if (hit) return jump(hit);
    f.pat += k;
    f.matches = this.flashMatches(f.pat, this);
    if (!f.matches.length) { this.flash = null; this.msg = 'Flash: مطابقتی نبود'; }
  },
});

// ---------- shortest key path between two cursor positions (for "par") ----------
const COUNTABLE = new Set(['h', 'j', 'k', 'l', 'w', 'b', 'e', 'W', 'B', 'E', '{', '}']);
function solveMoves(lines, from, cfg) {
  const v = new Vim(lines), N = lines.length, MAX = 16;
  const K = (r, c, w) => r + ':' + c + ':' + (w === Infinity ? 'I' : w);
  const dist = new Map(), prev = new Map(), best = new Map(), buckets = [];
  const edges = [];
  for (const m of cfg.m) {
    const mk = m.length === 2 ? { k: m } : { k: m };
    edges.push([mk, 0, m.length, m]);
    if (cfg.counts && COUNTABLE.has(m)) {
      const max = 'jk'.includes(m) ? 15 : 9;
      for (let n = 2; n <= max; n++) edges.push([mk, n, String(n).length + 1, n + m]);
    }
  }
  if (cfg.counts && cfg.m.includes('G')) for (let n = 1; n <= N; n++) edges.push([{ k: 'G' }, n, String(n).length + 1, n + 'G']);
  const push = (key, st, d) => (buckets[d] || (buckets[d] = [])).push([key, st]);
  const k0 = K(from.r, from.c, from.want);
  dist.set(k0, 0); push(k0, from, 0);
  for (let d = 0; d <= MAX; d++) {
    const b = buckets[d]; if (!b) continue;
    for (let bi = 0; bi < b.length; bi++) {
      const [key, st] = b[bi];
      if (dist.get(key) !== d) continue;
      const pc = st.r + ':' + st.c;
      if (!best.has(pc)) best.set(pc, key);
      const relax = (res, cost, label) => {
        if (!res || res.fail) return;
        const nd = d + cost; if (nd > MAX) return;
        const w = res.want === undefined ? res.c : res.want, nk = K(res.r, res.c, w);
        if (dist.has(nk) && dist.get(nk) <= nd) return;
        dist.set(nk, nd); prev.set(nk, [key, label]); push(nk, { r: res.r, c: res.c, want: w }, nd);
      };
      for (const [m, n, cost, label] of edges) relax(v.motion(m, n, st, false), cost, label);
      if (cfg.finds) {
        const seen = new Set();
        for (const ch of lines[st.r]) {
          if (ch === ' ' || seen.has(ch)) continue;
          seen.add(ch);
          for (const f of 'fFtT') relax(v.motion({ k: f, arg: ch }, 0, st, false), 2, f + ch);
        }
      }
    }
  }
  return {
    cost: (r, c) => { const k = best.get(r + ':' + c); return k ? dist.get(k) : Infinity; },
    path: (r, c) => { let k = best.get(r + ':' + c); const out = []; while (k && prev.has(k)) { const [pk, l] = prev.get(k); out.unshift(l); k = pk; } return out; },
  };
}
function flashCost(lines, from, t) {
  const v = new Vim(lines), l = lines[t.r];
  for (let n = 1; n <= 3; n++) {
    const pat = l.slice(t.c, t.c + n); if (pat.length < n) break;
    const m = v.flashMatches(pat, from).find(x => x.r === t.r && x.c === t.c);
    if (m && m.label) return { cost: n + 2, path: ['s', ...pat, m.label] };
  }
  return { cost: Infinity, path: [] };
}

// ---------- editor rendering ----------
const PYKW = new Set('def class return if elif else for while in not and or is import from as with try except finally raise pass break continue lambda yield async await None True False self global assert del'.split(' '));
function hlLine(line) {
  const out = new Array(line.length).fill('');
  let i = 0;
  while (i < line.length) {
    const ch = line[i];
    if (ch === '#') { for (let j = i; j < line.length; j++) out[j] = 'cm'; break; }
    if (ch === '"' || ch === "'") { let j = i + 1; while (j < line.length && line[j] !== ch) j += line[j] === '\\' ? 2 : 1; for (let x = i; x <= Math.min(j, line.length - 1); x++) out[x] = 'st'; i = j + 1; continue; }

    if (/[0-9]/.test(ch)) { let j = i; while (j < line.length && /[\w.]/.test(line[j])) j++; for (let x = i; x < j; x++) out[x] = 'nu'; i = j; continue; }
    if ('()[]{}'.includes(ch)) out[i] = 'br';
    i++;

}
function renderEditor(v, target) {
  const L = v.lines, sel = v.va ? v.vRange() : null;
  const fl = v.flash && v.flash.pat ? v.flash : null, fm = new Set(), lab = new Map();
  if (fl) for (const m of fl.matches) { for (let i = 0; i < fl.pat.length; i++) fm.add(m.r + ':' + (m.c + i)); if (m.label) lab.set(m.r + ':' + (m.c + fl.pat.length), m.label); }

    if (!sel) return false;
    if (sel.lw) return r >= sel.s.r && r <= sel.e.r;
    const p = { r, c }; return cmpPos(p, sel.s) >= 0 && cmpPos(p, sel.e) <= 0 && c < Math.max(1, L[r].length);
  };
  let html = '';
  for (let r = 0; r < L.length; r++) {
    const line = L[r], hl = hlLine(line), num = r === v.r ? r + 1 : Math.abs(r - v.r);
    let cells = '';
    for (let c = 0; c <= line.length; c++) {
      const key = r + ':' + c, cl = [];
      let ch = c < line.length ? line[c] : ' ';
      if (hl[c]) cl.push(hl[c]);
      if (inSel(r, c)) cl.push('sel');
      if (target && target.r === r && target.c === c) cl.push('tgt');
      if (fm.has(key)) cl.push('fm');
      if (lab.has(key)) { cl.push('fl'); ch = lab.get(key); }
      if (r === v.r && c === v.c && !fl) cl.push(v.mode === 'insert' ? 'bar' : 'cur');
      if (c === line.length && !cl.length) continue;
      cells += cl.length ? `<span class="${cl.join(' ')}">${esc(ch)}</span>` : esc(ch);
    }
    html += `<div class="ln"><span class="gut${r === v.r ? ' gcur' : ''}">${num}</span><span class="txt">${cells}</span></div>`;
  }

  $('#editor').classList.toggle('flashing', !!fl);

  $('#mode').className = 'mode ' + mode; $('#mode').textContent = ML[mode];

  else if (v.msg) cl.innerHTML = `<span class="msg-fa">${esc(v.msg)}</span>`;

// ---------- move targets ----------
function pickTarget(L, v) {
  const from = { r: v.r, c: v.c, want: v.c };
  const useFlash = L.cfg.flash || L.kind === 'challenge';
  const A = L.cfg.m ? solveMoves(v.lines, from, L.cfg) : null;
  const B = L.base ? solveMoves(v.lines, from, L.base) : null;
  const cands = [], loose = [];
  v.lines.forEach((line, r) => {
    for (let c = 0; c < line.length; c++) {
      if (line[c] === ' ' || (r === from.r && c === from.c)) continue;
      let cost = A ? A.cost(r, c) : Infinity, path = A && cost < Infinity ? A.path(r, c) : [];
      if (useFlash) { const f = flashCost(v.lines, from, { r, c }); if (f.cost < cost) { cost = f.cost; path = f.path; } }
      if (cost === Infinity || cost < L.par[0] || cost > L.par[1]) continue;
      const item = { pos: { r, c }, par: cost, path };
      loose.push(item);
      if (!B || B.cost(r, c) > cost + (L.cfg.flash ? 1 : 0)) cands.push(item);
    }
  });
  return rand(cands.length ? cands : loose.length ? loose : [{ pos: { r: 0, c: 0 }, par: 3, path: ['g', 'g'] }]);
}

const MODE_FA = { normal: 'در حالت Normal', insert: 'در حالت Insert', visual: 'در حالت Visual' };
const SESSION = 15;
const Drill = {
  mode: S.drillMode, cats: new Set(S.drillCats || CATS.map(c => c[0])),
  queue: [], i: 0, cur: null, typed: 0, miss: false, t0: 0, res: [], wait: false, over: false, opts: null,

  card(id) { return S.cards[id] || (S.cards[id] = { box: 0, ok: 0, bad: 0, ms: 0, seen: 0 }); },
  renderCats() {
    $('#dCats').innerHTML = CATS.map(([id, name, list]) => {
      const m = list.filter(x => ((S.cards[id + ':' + x[0]] || {}).box || 0) >= 4).length;
      return `<button class="cat${this.cats.has(id) ? ' on' : ''}" data-cat="${id}">${esc(name)}<small>${fa(m)}/${fa(list.length)}</small></button>`;
    }).join('');
    document.querySelectorAll('#dMode button').forEach(b => b.classList.toggle('on', b.dataset.m === this.mode));
  },
  start() {
    const pool = CARDS.filter(c => this.cats.has(c.cat));
    if (!pool.length) { $('#dCard').innerHTML = '<p>حداقل یک دسته را انتخاب کن.</p>'; return; }
    const W = [8, 5, 3, 2, 1, .5];
    const weighted = pool.map(c => { const s = S.cards[c.id]; const w = !s ? 3 : W[s.box] * (s.bad > s.ok ? 2 : 1); return { c, k: Math.random() ** (1 / w) }; });
    weighted.sort((a, b) => b.k - a.k);

    this.show();

    const c = this.cur;

    if (this.mode === 'recall') {
      body = `<div class="prompt">${bidi(c.desc)}</div><div class="cmode">${MODE_FA[c.mode]}</div><div class="slots">${this.slots()}</div><div class="answer" id="dAns"></div>
        <button class="btn" id="dIdk">نمی‌دانم — نشانم بده</button>`;
    } else {
      const same = CARDS.filter(x => x.cat === c.cat && x.desc !== c.desc && x.keys !== c.keys);
      const others = CARDS.filter(x => x.desc !== c.desc && x.keys !== c.keys);
      const pick = []; const src = same.length >= 3 ? same : others;
      while (pick.length < 3) { const x = rand(src); if (!pick.includes(x)) pick.push(x); }
      this.opts = [c, ...pick].sort(() => Math.random() - .5);
      body = `<div class="prompt"><span class="ltr">${kbds(c.t)}</span></div><div class="cmode">${MODE_FA[c.mode]}</div>
        <div class="opts">${this.opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="n">${i + 1}</span><span>${bidi(o.desc)}</span></button>`).join('')}</div>`;
    }
    const el = $('#dCard'); el.className = 'card';
    el.innerHTML = `<div class="ccat">${esc(CAT_NAME[c.cat])} · کارت ${fa(this.i + 1)} از ${fa(this.queue.length)}</div>${body}`;
    this.stats();
  },
  slots() {
    return this.cur.t.map((k, i) => `<span class="slot${i < this.typed ? ' ok' : i === this.typed ? ' next' : ''}">${i < this.typed ? esc(pretty(k)) : ''}</span>`).join('');
  },
  stats() {
    const n = this.res.length, ok = this.res.filter(r => r.ok).length;
    const avg = n ? this.res.reduce((a, r) => a + r.ms, 0) / n / 1000 : 0;
    const mastered = CARDS.filter(c => ((S.cards[c.id] || {}).box || 0) >= 4).length;
    $('#dStats').innerHTML = `<span>دقت: <b>${n ? fa(Math.round(100 * ok / n)) + '٪' : '—'}</b></span><span>میانگین زمان: <b>${n ? fa(avg.toFixed(1)) + ' ثانیه' : '—'}</b></span><span>تسلط کامل: <b>${fa(mastered)}</b> از ${fa(CARDS.length)} میانبر</span>`;
  },
  reveal() {
    this.miss = true; this.typed = 0;
    const el = $('#dCard'); el.classList.remove('bad'); void el.offsetWidth; el.classList.add('bad');
    $('#dAns').innerHTML = `جواب: <span class="ltr">${kbds(this.cur.t)}</span> — حالا خودت تایپش کن`;
    el.querySelector('.slots').innerHTML = this.slots();
  },
  key(k) {
    if (this.over) { if (k === '<CR>') this.start(); return k === '<CR>'; }
    if (!this.cur || this.wait) return true;
    activity();
    if (this.mode === 'recog') {
      const n = '1234'.indexOf(k);
      if (n < 0 || !this.opts[n]) return true;
      return this.answer(this.opts[n] === this.cur, n), true;
    }
    const want = this.cur.t[this.typed];
    const got = k === ' ' ? '<leader>' : k;
    if (got === want) {
      this.typed++;
      $('#dCard .slots').innerHTML = this.slots();
      if (this.typed === this.cur.t.length) this.grade(!this.miss);
    } else this.reveal();
    return true;
  },
  answer(ok, n) {
    const btns = document.querySelectorAll('#dCard .opt');
    btns[this.opts.indexOf(this.cur)].classList.add('right');
    if (!ok) btns[n].classList.add('wrong');
    this.grade(ok, true);
  },
  grade(ok, recog) {
    this.wait = true;
    const ms = performance.now() - this.t0, s = this.card(this.cur.id);
    s.seen++;
    if (ok) {
      s.ok++;
      const cap = recog ? 2 : 5;
      if (ms < 4000 && s.box < cap) s.box++;
      s.ms = s.ms ? s.ms * .6 + ms * .4 : ms;
    } else { s.bad++; s.box = 0; }
    this.res.push({ ok, ms, c: this.cur });
    save();
    const el = $('#dCard'); el.classList.add(ok ? 'good' : 'bad');
    const sp = ms < 1500 ? '⚡ آنی' : ms < 3000 ? 'خوب' : 'کمی کند';
    if (ok) el.insertAdjacentHTML('beforeend', `<div class="speed">${fa((ms / 1000).toFixed(1))} ثانیه · ${sp}</div>`);
    this.stats(); this.renderCats();
    setTimeout(() => { this.i++; if (this.i >= this.queue.length) this.end(); else this.show(); }, ok ? 650 : 1600);
  },
  end() {
    this.over = true;
    const n = this.res.length, ok = this.res.filter(r => r.ok).length, miss = this.res.filter(r => !r.ok);
    const avg = this.res.reduce((a, r) => a + r.ms, 0) / n / 1000;
    $('#dCard').className = 'card';
    $('#dCard').innerHTML = `<div class="prompt">${fa(ok)} از ${fa(n)} درست</div>
      <p>میانگین ${fa(avg.toFixed(1))} ثانیه برای هر میانبر. هدف: همه زیر ۱٫۵ ثانیه.</p>
      ${miss.length ? `<div class="misslist"><b>این‌ها را مرور کن:</b>${miss.map(r => `<div><span class="ltr">${kbds(r.c.t)}</span><span>${bidi(r.c.desc)}</span></div>`).join('')}</div>` : '<p>بدون اشتباه 👏</p>'}
      <button class="btn primary" id="dAgain">دور بعد (Enter)</button>`;
    refreshMeta();
  },
};
$('#dCats').addEventListener('click', e => {
  const b = e.target.closest('.cat'); if (!b) return; b.blur();
  const id = b.dataset.cat;
  if (Drill.cats.has(id)) Drill.cats.delete(id); else Drill.cats.add(id);
  S.drillCats = [...Drill.cats]; save(); Drill.renderCats();
});
$('#dMode').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; b.blur(); Drill.mode = S.drillMode = b.dataset.m; save(); Drill.renderCats(); Drill.start(); });
$('#dStart').onclick = e => { e.currentTarget.blur(); Drill.start(); };
$('#dCard').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; b.blur();
  if (b.id === 'dIdk') { if (!Drill.wait) Drill.reveal(); }
  else if (b.id === 'dAgain') Drill.start();
  else if (b.dataset.i !== undefined && !Drill.wait) Drill.answer(Drill.opts[+b.dataset.i] === Drill.cur, +b.dataset.i);
});

// ---------- stats ----------
function renderStats() {
  const mins = Object.values(S.days).reduce((a, b) => a + b, 0) / 60;
  const mastered = CARDS.filter(c => ((S.cards[c.id] || {}).box || 0) >= 4).length;
  const lessonsDone = LESSONS.filter(l => (S.lessons[l.id] || {}).stars).length;
  const kpi = (v, l) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`;
  const bars = CATS.map(([id, name, list]) => {
    const pts = list.reduce((a, x) => a + Math.min(4, (S.cards[id + ':' + x[0]] || {}).box || 0), 0) / (list.length * 4);
    return `<div class="barrow"><span>${esc(name)}</span><div class="track"><div class="fill" style="width:${Math.round(pts * 100)}%"></div></div><span class="pct">${Math.round(pts * 100)}%</span></div>`;
  }).join('');
  const lrows = LESSONS.filter(l => l.kind !== 'challenge').map(l => `<div class="lrow"><span>${bidi(l.title)}</span><span class="stars">${starStr((S.lessons[l.id] || {}).stars || 0)}</span></div>`).join('');
  const weak = CARDS.filter(c => S.cards[c.id] && S.cards[c.id].bad).sort((a, b) => (S.cards[b.id].bad - S.cards[b.id].ok) - (S.cards[a.id].bad - S.cards[a.id].ok)).slice(0, 10);
  $('#statsView').innerHTML = `
    <div class="kpis">${kpi(fa(streak()) + ' روز', 'روزهای پشت سر هم')}${kpi(fa(Math.round(mins)) + ' دقیقه', 'کل زمان تمرین')}${kpi(fa(starTotal()) + ' / ' + fa((LESSONS.length - 1) * 3), 'ستاره‌ی درس‌ها')}${kpi(fa(mastered) + ' / ' + fa(CARDS.length), 'میانبرِ ملکه‌ی ذهن')}${kpi(fa(S.challenge), 'رکورد چالش ۶۰ ثانیه')}</div>
    <div class="cols">
      <div><h3>تسلط بر میانبرها</h3>${bars}<p class="note">هر میانبر وقتی «ملکه‌ی ذهن» حساب می‌شود که چند بار پشت سر هم، درست و زیر ۴ ثانیه تایپش کنی.</p>
        <h3 style="margin-top:1.5rem">سخت‌ترین‌ها برای تو</h3><div class="weak">${weak.length ? weak.map(c => `<div><span class="ltr">${kbds(c.t)}</span><span>${bidi(c.desc)}</span></div>`).join('') : '<p class="note">هنوز اشتباهی ثبت نشده.</p>'}</div></div>
      <div><h3>درس‌ها (${fa(lessonsDone)} از ${fa(LESSONS.length - 1)})</h3>${lrows}
        <button class="btn danger-btn" id="resetAll" style="margin-top:1.5rem">پاک کردن همه‌ی پیشرفت</button></div>
    </div>`;
  $('#resetAll').onclick = e => {
    const b = e.currentTarget;
    if (b.dataset.sure) { const theme = S.theme; S = defaults(); S.theme = theme; save(); refreshMeta(); Dojo.renderList(); Drill.renderCats(); renderStats(); }
    else { b.dataset.sure = '1'; b.textContent = 'مطمئنی؟ دوباره بزن'; }
  };
}

// ---------- tabs, theme, keys ----------
let tab = 'dojo';
function setTab(t) {
  tab = t;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  for (const x of ['dojo', 'drill', 'stats']) $('#tab-' + x).hidden = x !== t;
  refreshMeta();
  if (t === 'stats') renderStats();
  if (t === 'drill' && !Drill.cur && !Drill.over) Drill.start();
}
document.querySelector('nav.tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { b.blur(); setTab(b.dataset.tab); } });
function applyTheme() { if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
$('#themeBtn').onclick = e => { e.currentTarget.blur(); S.theme = { '': 'dark', dark: 'light', light: '' }[S.theme || '']; applyTheme(); save(); };
document.addEventListener('keydown', e => {
  if (e.isComposing) return;
  const k = keyName(e); if (!k) return;
  const used = tab === 'dojo' ? Dojo.key(k) : tab === 'drill' ? Drill.key(k) : false;
  if (used) e.preventDefault();
});

applyTheme();
refreshMeta();
Drill.renderCats();
Dojo.open(S.cur);
</script>
</body>
